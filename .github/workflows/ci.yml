name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 배포할 JAR 파일 저장
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: assignment-jar
          path: build/libs/assignment-1.0-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 빌드한 JAR 파일 가져오기
        uses: actions/download-artifact@v4
        with:
          name: assignment-jar
          path: build/libs/

      - name: SSH 접속 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH17K82qvvN7cSxsafjmlYKQw1l1z8Gun2mAJBmqhxQ+\n' "$EC2_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: EC2에 JAR 파일 전달
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            build/libs/assignment-1.0-SNAPSHOT.jar \
            "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/assignment-deploy.jar"

      - name: Spring 서버 배포 및 응답 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" 'bash -s' <<'EOF'
          set -eu

          APP=/home/ubuntu/gyoeun.jeong/build/libs/assignment-1.0-SNAPSHOT.jar
          NEW=/home/ubuntu/assignment-deploy.jar

          cp "$APP" "$APP.previous"
          mv "$NEW" "$APP"

          sudo -n systemctl restart assignment.service

          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 -o /dev/null \
              https://kyooonnnggg.p-e.kr/posts; then
              echo "배포 후 API 응답 확인 성공"
              exit 0
            fi

            sleep 3
          done

          echo "배포 후 API 응답 확인 실패"
          exit 1
          EOF